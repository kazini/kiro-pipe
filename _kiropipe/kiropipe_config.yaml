# KiroPipe Configuration
# This is a minimal working configuration

# Proxy settings
proxy:
  port: 29974

# Kiro executable
kiro:
  exe_path: "C:\\Users\\Kazini\\Vault\\Programas\\Coding\\coding tools\\Kiro\\kiro.exe"  # Auto-detect

# Kiro endpoint settings (TRUE = allow, FALSE = block)
kiro_endpoint:
  telemetry: true
  updates: false
  models: true
  force_toggle_usage_limits: null  # Auto mode

# Debug settings
debug:
  debug_mode_enabled: false
  store_interaction_blocks: false

# Providers
providers:
  kiro:
    enabled: true
    type: passthrough
    description: "Kiro's default AWS Q models"
    models:
      - name: "kiro-default"
        alias: ["kiro", "default", "aws-q"]
        description: "Kiro's default model"
  
  # Anthropic Claude (direct API)
  anthropic:
    enabled: false
    type: anthropic
    api_base: "https://api.anthropic.com/v1"
    api_key: null
    description: "Anthropic Claude models"
    models:
      - name: "claude-haiku-4-5-20251001"
        display_name: "Claude 4.5 Haiku"
        alias: ["claude-haiku"]
        description: "Claude 4.5 Haiku - Fast and efficient"
        max_tokens: 4096

  cliproxyapi:
    enabled: true
    type: openai
    api_base: "http://localhost:8317/v1"
    api_key: null
    description: "..."
    models:
      - name: "qwen-flash"
        display_name: "Qwen Flash"
        description: "via CliProxyAPI (oAuth)"
      - name: "qwen-plus"
        display_name: "Qwen Plus"
        description: "via CliProxyAPI (oAuth)"
        max_tokens: 4096
      - name: "gemini-3-pro"
        display_name: "Gemini 3 Pro"
        description: "via CliProxyAPI (oAuth)"
        max_tokens: 4096
      - name: "gemini-3-flash"
        display_name: "Gemini 3 Flash"
        alias: ["gemini-3-flash"]
        description: "via CliProxyAPI (oAuth)"
        max_tokens: 4096
      - name: "gemini-2.5-pro"
        display_name: "Gemini 2.5 Pro"
        alias: ["gemini-2.5-pro"]
        description: "via CliProxyAPI (oAuth)"
        max_tokens: 4096
      - name: "gemini-2.5-flash"
        display_name: "Gemini 2.5 Flash"
        alias: ["gemini-2.5-flash"]
        description: "via CliProxyAPI (oAuth)"
        max_tokens: 4096

  openrouter:
    enabled: true
    type: openai
    api_base: "https://openrouter.ai/api/v1"
    api_key: null
    description: "OpenRouter models."
    models:
      - name: "minimax/minimax-m2.5:free"
        display_name: "MiniMax M2.5"
        alias: ["minimax-m2.5"]
        description: "via OpenRouter (free)"
        max_tokens: 4096
      - name: "qwen/qwen3-coder:free"
        display_name: "Qwen3 Coder 480b"
        alias: ["qwen-coder-480b"]
        description: "via OpenRouter (free)"
        max_tokens: 4096
      - name: "openai/gpt-oss-120b:free"
        display_name: "GPT OSS 120b"
        alias: ["gpt-oss-120b"]
        description: "via OpenRouter (free)"
        max_tokens: 4096
      - name: "nvidia/nemotron-3-super-120b-a12b:free"
        display_name: "Nemotron 3s"
        alias: ["nemotron-3s"]
        description: "via OpenRouter (free)"
        max_tokens: 4096


  # OpenAI (direct API, without LiteLLM)
  openai:
    enabled: false
    type: openai
    api_base: "https://api.openai.com/v1"
    api_key: null
    description: "OpenAI GPT models (direct)"
    models:
      - name: "gpt-4-turbo"
        display_name: "GPT-4 Turbo"
        alias: ["gpt4-turbo"]
        description: "OpenAI GPT-4 Turbo"
        max_tokens: 4096
      - name: "gpt-4o"
        display_name: "GPT-4o"
        alias: ["gpt4o"]
        description: "OpenAI GPT-4o"
        max_tokens: 4096
  
  # LiteLLM (universal interface)
  litellm:
    enabled: false
    type: litellm
    description: "Universal LLM interface"
    
    groq:
      api_base: "https://api.groq.com/openai/v1"
      api_key: null
      models:
        - name: "groq/llama-3.1-70b-versatile"
          display_name: "Llama 3.1 70B (Groq)"
          alias: ["groq", "llama-groq"]
          description: "Llama 3.1 70B on Groq"
          max_tokens: 4096
    
    # OpenAI / OpenRouter via LiteLLM
    openai:
      api_base: "https://api.openai.com/v1"  # Or "https://openrouter.ai/api/v1"
      api_key: null
      models:
        - name: "openai/gpt-4"
          display_name: "GPT-4 (via LiteLLM)"
          alias: ["gpt4"]
          description: "OpenAI GPT-4 via LiteLLM"
          max_tokens: 4096
    
    # Ollama (local)
    ollama:
      api_base: "http://localhost:11434"
      api_key: null
      models:
        - name: "ollama/llama3.2"
          display_name: "Llama 3.2 (Local)"
          alias: ["llama", "local"]
          description: "Llama 3.2 running locally via Ollama"
          max_tokens: 4096

# Default model
default_model: "kiro-default"
