# KiroPipe Configuration

kiro:
  exe_path: "C:\\Users\\Kazini\\Vault\\Programas\\Coding\\coding tools\\Kiro\\kiro.exe"

proxy:
  port: 29974

debug:
  debug_mode_enabled: true
  store_interaction_blocks: false

# ─── Kiro endpoint behaviour ─────────────────────────────────────────────────
kiro_endpoint:
  # Allow OTel telemetry (/v1/metrics, /v1/traces) when on Kiro passthrough models.
  # Adaptive: automatically blocked when a custom model is active.
  telemetry: true
  updates: false
  models: true                                              # Allow Kiro's own passthrough models
  force_toggle_usage_limits: null               # null = block for custom, allow for passthrough | true = always allow  |  false = always block
  auth_fake_login: true                    # Intercept /oauth/token and /logout — lets Kiro run without a registered account
  start_blocking: false                     # Start with block_aws_traffic=True, typically only blocks as toggle when custom model is used
  strict_whitelist: false                    # Block any amazonaws.com / kiro.dev path not explicitly handled by kiropipe (buggy in passthrough)
  
  # Block /v1/metrics and /v1/traces even when Kiro passthrough models are in use.
  # When false (default): these are blocked adaptively (only when custom model active).
  block_telemetry_always: false
  
  
# ─── Completions (inline autocomplete) ───────────────────────────────────────
# null          → block when custom model active, passthrough to AWS for Kiro (default)
# 'passthrough' → always forward to AWS regardless of model
# 'current'     → use the last active custom model's provider
# '<model_name>'→ always use that specific configured model (e.g. 'qwen-flash')
completions: null


# ─── Default model ────────────────────────────────────────────────────────────
default_model: "kiro-default"

# ─── Providers ───────────────────────────────────────────────────────────────
providers:

  # Kiro's built-in AWS Q models (passthrough)
  kiro:
    enabled: true
    type: passthrough
    description: "Kiro's default AWS Q models"
    models:
      - name: "kiro-default"
        alias: ["kiro", "default", "aws-q"]
        description: "Kiro's default model"

  anthropic:
    enabled: false
    type: anthropic
    api_base: "https://api.anthropic.com/v1"
    api_key: null
    models:
      - name: "claude-haiku-4-5-20251001"
        display_name: "Claude 4.5 Haiku"
        alias: ["claude-haiku"]
        description: "Claude 4.5 Haiku - Fast and efficient"
