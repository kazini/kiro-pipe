# KiroPipe Configuration
# Deep LiteLLM integration for universal LLM provider support

# Proxy settings
proxy:
  port: 29974

# Kiro executable
kiro:
  exe_path: null  # Auto-detect

# Kiro endpoint settings (TRUE = allow, FALSE = block)
kiro_endpoint:
  telemetry: false
  updates: false
  models: true
  force_toggle_usage_limits: null  # Auto mode

# Debug settings
debug:
  debug_mode_enabled: true
  store_interaction_blocks: false

# Default model (used on startup)
default_model: "kiro-default"

# Providers
providers:
  kiro:
    enabled: true
    type: passthrough
    description: "Kiro's default AWS Q models"
    models:
      - name: "kiro-default"
        alias: ["kiro", "default", "aws-q"]
        description: "Kiro's default model"
  
  anthropic:
    enabled: false
    type: anthropic
    api_base: "https://api.anthropic.com/v1"
    api_key: null
    description: "Anthropic Claude models (direct API)"
    models:
      - name: "claude-3-5-sonnet-20241022"
        alias: ["claude", "sonnet"]
        display_name: "Claude 3.5 Sonnet"
        description: "Claude 3.5 Sonnet"
        max_tokens: 8192

  litellm:
    enabled: true
    type: litellm
    description: "Universal LLM interface (100+ providers)"
## =================================================== ##
    ollama:
      api_base: "http://localhost:11434"
      api_key: null
      models:
        - name: "ollama/llama3.2"
          enabled: false
          alias: ["llama", "local"]
          display_name: "Llama 3.2 (Local)"
